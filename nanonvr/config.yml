name: "NanoNVR"
description: "The tiniest NVR."
version: "1.5.1"
slug: "nanonvr"
url: "https://github.com/mancontr/nanonvr"
image: "mancontr/nanonvr"
init: false
ingress: true
homeassistant_api: true
panel_icon: mdi:cctv
panel_admin: false
ports:
  21821/tcp: 21821
  21822/tcp: 21822
ports_description:
  21821/tcp: "FTP Control connection port"
  21822/tcp: "FTP Data connection port"
map:
  - config:rw
  - media:rw
services:
  - "mqtt:want"
arch:
  - aarch64
  - amd64
